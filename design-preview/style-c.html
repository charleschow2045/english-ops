<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Style C · Modern Explorer — English Quest preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Nunito", "system-ui", "sans-serif"], head: ['"Plus Jakarta Sans"', "Nunito", "sans-serif"] } } } };
  </script>
  <style>
    :root { --ink: #12353d; --muted: #4f6b72; --teal: #0f5b66; --teal2: #1b8a94; --coral: #ff6b4a; --sun: #ffc857; --bg: #f1f6f5; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: Nunito, system-ui, sans-serif; color: var(--ink); background: var(--bg); min-height: 100vh; overflow-x: hidden; }
    .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: #0b3a42; color: #dff3f1; font-size: 13px; font-weight: 700; }
    .pv-bar a { color: inherit; }
    .pv-name { opacity: .8; }
    .pv-links { margin-left: auto; display: flex; gap: 6px; }
    .pv-chip { padding: 4px 10px; border-radius: 999px; border: 1px solid #3f8a93; text-decoration: none; }
    .pv-chip.on { background: #fff; color: #0b3a42 !important; border-color: #fff; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    .h { font-family: "Plus Jakarta Sans", Nunito, sans-serif; font-weight: 800; letter-spacing: -0.015em; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 14px; font-weight: 800; font-size: 14px; background: #fff; border: 1.5px solid #d3e4e2; white-space: nowrap; }
    .pill.hot { background: #fff1ec; border-color: #ffd2c4; color: #b63a1a; }
    .pill.cool { background: #e6f4f6; border-color: #bfe0e4; color: #0d5560; }

    .passport { position: relative; border-radius: 28px; padding: 18px 18px 18px; color: #fff; overflow: hidden;
      background: radial-gradient(90% 120% at 100% 0%, rgba(255, 200, 87, .28), transparent 55%), linear-gradient(145deg, #0c4a55, var(--teal) 50%, var(--teal2)); box-shadow: 0 18px 34px -18px rgba(15, 91, 102, .8); }
    .passport::before { content: ""; position: absolute; inset: 8px; border-radius: 22px; border: 1.5px dashed rgba(255, 255, 255, .28); pointer-events: none; }
    .bar { height: 14px; border-radius: 999px; background: rgba(255, 255, 255, .22); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--sun), #ffe29a); }
    .stamps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; }
    .stamp { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 20px; border: 2px dashed rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .08); filter: grayscale(1); opacity: .65; }
    .stamp.reached { filter: none; opacity: 1; border: 2px solid var(--sun); background: rgba(255, 255, 255, .95); transform: rotate(-6deg); box-shadow: 0 0 0 4px rgba(255, 200, 87, .28); }
    .slabel { font-size: 13px; font-weight: 700; color: rgba(255, 255, 255, .85); margin-top: 6px; line-height: 1.15; }
    .slabel.cur { color: #fff; }

    .card { background: #fff; border: 1.5px solid #dbe8e6; border-radius: 20px; box-shadow: 0 8px 18px -14px rgba(15, 91, 102, .5); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 14px; border-radius: 14px; font-weight: 800; font-size: 14px; background: var(--coral); color: #fff; white-space: nowrap; box-shadow: 0 4px 0 #d94b2c; }
    .btn.done { background: #e1f4e8; color: #17703a; box-shadow: none; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .mod { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .tile { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 24px; flex-shrink: 0; }
    .sub { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.25; }
    .star { display: inline-block; margin-left: 4px; }
    .nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(420px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 24px; background: #0c3f49; box-shadow: 0 14px 28px -10px rgba(12, 63, 73, .7); }
    .nav div { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 18px; font-size: 13px; font-weight: 700; color: #a8d1d2; }
    .nav div span { font-size: 20px; line-height: 1.1; }
    .nav .on { background: var(--coral); color: #fff; }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="app"></div>
  <script src="data.js"></script>
  <script>
    (function () {
      const P = window.PV, s = P.state;
      document.getElementById("bar").innerHTML = P.previewBar("Style C · Modern Explorer");
      const STAMP = ["🧭", "🔭", "🥾", "🗺️", "⚓", "👑"]; // one stamp per level

      const stamps = P.LEVELS.map((name, i) => {
        const reached = i <= P.levelIndex, now = i === P.levelIndex, next = i === P.levelIndex + 1;
        return `<div><div class="stamp ${reached ? "reached" : ""}">${STAMP[i]}</div>
          <div class="slabel ${now ? "cur" : ""} ${now || next ? "" : "hidden sm:block"}">${P.esc(name)}</div></div>`;
      }).join("");

      const missions = P.missionKeys.map((k) => {
        const m = P.byKey[k], done = P.isDone(k);
        return `<div class="card flex items-center gap-3 p-3" style="${done ? "background:#f7fbfa" : ""}">
          <div class="tile" style="background:${P.tint(m.hue, 92)};width:52px;height:52px;border-radius:50%;font-size:26px">${done ? "✅" : m.emoji}</div>
          <div class="min-w-0 flex-1"><div class="h text-[17px] leading-tight">${P.esc(m.label)}</div>
            <div class="sub mt-0.5">${P.esc(P.MISSION_TEXT[k])}</div></div>
          <span class="btn ${done ? "done" : ""}">${done ? "Done ✓" : "Start ›"}</span></div>`;
      }).join("");

      const mods = P.MODULES.map((m) => {
        const mission = P.isMission(m.key), done = P.isDone(m.key);
        const status = done ? "Done today ✓" : mission ? "Today's mission" : "Tap to start";
        return `<div class="card mod" style="${mission ? "border-color:" + P.solid(m.hue, 70) : ""}"><div class="tile" style="background:${P.tint(m.hue, 92)}">${m.emoji}</div>
          <div><div class="h text-[16px] leading-tight">${P.esc(m.label)}${mission ? '<span class="star">⭐</span>' : ""}</div>
          <div class="sub mt-1" style="${done ? "color:#17703a" : ""}">${status}</div>
          ${m.key === "grammar" ? `<div class="sub" style="color:var(--teal)">${P.grammarProgress}</div>` : ""}</div></div>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="wrap" style="padding-bottom:116px">
          <header class="pt-5">
            <div class="flex items-start justify-between gap-3">
              <div><div class="h text-[26px] leading-tight">🧭 English Quest</div>
                <div class="text-[14px] font-bold" style="color:var(--muted)">${P.dateText}</div></div>
            </div>
            <div class="flex flex-wrap gap-2 mt-3"><span class="pill hot">🔥 ${s.streak} day${s.streak === 1 ? "" : "s"}</span><span class="pill cool">🧊 ${s.freezes} freeze${s.freezes === 1 ? "" : "s"}</span></div>
          </header>

          <section class="passport mt-4">
            <div class="relative flex items-center justify-between gap-3" style="position:relative">
              <div><div class="text-[13px] font-extrabold" style="color:#ffe29a">Explorer's passport</div>
                <div class="h text-[28px] leading-tight">${P.LEVELS[P.levelIndex]}</div></div>
              <div class="text-right text-[14px] font-bold" style="color:rgba(255,255,255,.85)">Next level<div class="h text-[17px]" style="color:#ffe29a">${P.LEVELS[P.levelIndex + 1]} ›</div></div>
            </div>
            <div class="bar my-3" style="position:relative"><i style="width:${P.progressPct}%"></i></div>
            <div class="text-[15px] font-extrabold mb-4" style="position:relative">${s.total} / ${P.GOAL} missions completed</div>
            <div class="stamps" style="position:relative">${stamps}</div>
          </section>

          <main>
            <div class="flex items-baseline justify-between mt-6 mb-3"><h2 class="h text-[21px]">Today's Missions</h2><span class="text-[14px] font-extrabold" style="color:var(--muted)">${P.doneCount}/3 done</span></div>
            <div class="flex flex-col gap-3">${missions}</div>
            <h2 class="h text-[21px] mt-7 mb-3">All Activities</h2>
            <div class="grid2">${mods}</div>
          </main>
        </div>
        <nav class="nav" aria-label="Preview navigation (not interactive)">
          <div class="on"><span>🏠</span>Home</div><div><span>🧩</span>Activities</div><div><span>🏅</span>Badges</div><div><span>📒</span>Notebook</div>
        </nav>`;
    })();
  </script>
</body>
</html>

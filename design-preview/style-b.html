<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>Style B · Soft Dawn — English Quest preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ["Nunito", "system-ui", "sans-serif"], head: ["Poppins", "Nunito", "sans-serif"] } } } };
  </script>
  <style>
    :root { --ink: #2c2750; --muted: #6a6590; --violet: #7c6cf0; --violet2: #b39cff; --rose: #f08fb8; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: Nunito, system-ui, sans-serif; color: var(--ink); min-height: 100vh; overflow-x: hidden;
      background: radial-gradient(60% 40% at 15% 0%, #e4dcff 0%, transparent 70%), radial-gradient(55% 40% at 95% 15%, #ffdff0 0%, transparent 70%), radial-gradient(70% 50% at 50% 100%, #dbe9ff 0%, transparent 70%), #f6f2ff; background-attachment: fixed; }
    .pv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 16px; background: rgba(255, 255, 255, .7); color: var(--ink); font-size: 13px; font-weight: 700; border-bottom: 1px solid rgba(124, 108, 240, .2); }
    .pv-bar a { color: inherit; }
    .pv-name { opacity: .75; }
    .pv-links { margin-left: auto; display: flex; gap: 6px; }
    .pv-chip { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(124, 108, 240, .45); text-decoration: none; }
    .pv-chip.on { background: var(--violet); color: #fff !important; border-color: var(--violet); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    .h { font-family: Poppins, Nunito, sans-serif; font-weight: 700; letter-spacing: -0.01em; }
    .glass { background: rgba(255, 255, 255, .58); backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); border: 1px solid rgba(255, 255, 255, .85); border-radius: 24px; box-shadow: 0 10px 30px -14px rgba(100, 80, 200, .35), inset 0 1px 0 rgba(255, 255, 255, .9); }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 14px; background: rgba(255, 255, 255, .7); border: 1px solid rgba(124, 108, 240, .25); white-space: nowrap; }
    .bar { height: 14px; border-radius: 999px; background: rgba(124, 108, 240, .15); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--violet), var(--violet2) 60%, var(--rose)); }
    .dots { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; position: relative; }
    .dot { width: 30px; height: 30px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-size: 14px; font-weight: 800; background: rgba(255, 255, 255, .8); color: #9a95c0; border: 2px solid rgba(124, 108, 240, .22); }
    .dot.reached { background: var(--violet); color: #fff; border-color: var(--violet); }
    .dot.now { box-shadow: 0 0 0 4px rgba(124, 108, 240, .2); }
    .dlabel { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 6px; line-height: 1.15; }
    .dlabel.cur { color: var(--ink); }
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 14px; border-radius: 999px; font-weight: 800; font-size: 14px; background: linear-gradient(135deg, var(--violet), #9a86ff); color: #fff; white-space: nowrap; }
    .btn.done { background: rgba(223, 246, 232, .9); color: #17703a; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .mod { padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; border-radius: 22px; }
    @media (min-width: 640px) { .mod { flex-direction: row; } }
    .tile { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 23px; flex-shrink: 0; }
    .sub { font-size: 13px; font-weight: 700; color: var(--muted); line-height: 1.25; }
    .nav { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(420px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 26px; background: rgba(255, 255, 255, .72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, .9); box-shadow: 0 14px 30px -12px rgba(100, 80, 200, .45); }
    .nav div { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; border-radius: 20px; font-size: 13px; font-weight: 700; color: var(--muted); }
    .nav div span { font-size: 20px; line-height: 1.1; }
    .nav .on { background: rgba(124, 108, 240, .16); color: var(--violet); }
  </style>
</head>
<body>
  <div id="bar"></div>
  <div id="app"></div>
  <script src="data.js"></script>
  <script>
    (function () {
      const P = window.PV, s = P.state;
      document.getElementById("bar").innerHTML = P.previewBar("Style B · Soft Dawn");

      const dots = P.LEVELS.map((name, i) => {
        const reached = i <= P.levelIndex, now = i === P.levelIndex, next = i === P.levelIndex + 1;
        return `<div><div class="dot ${reached ? "reached" : ""} ${now ? "now" : ""}">${reached ? "★" : i + 1}</div>
          <div class="dlabel ${now ? "cur" : ""} ${now || next ? "" : "hidden sm:block"}">${P.esc(name)}</div></div>`;
      }).join("");

      const missions = P.missionKeys.map((k) => {
        const m = P.byKey[k], done = P.isDone(k);
        return `<div class="glass flex items-center gap-3 p-3" style="border-radius:22px;${done ? "opacity:.8" : ""}">
          <div class="tile" style="background:${P.tint(m.hue, 91)};width:52px;height:52px;border-radius:50%;font-size:26px">${done ? "✅" : m.emoji}</div>
          <div class="min-w-0 flex-1"><div class="h text-[16px] leading-tight">${P.esc(m.label)}</div>
            <div class="sub mt-0.5">${P.esc(P.MISSION_TEXT[k])}</div></div>
          <span class="btn ${done ? "done" : ""}">${done ? "Done ✓" : "Start ›"}</span></div>`;
      }).join("");

      const mods = P.MODULES.map((m) => {
        const mission = P.isMission(m.key), done = P.isDone(m.key);
        const status = done ? "Done today ✓" : mission ? "Today's mission" : "Tap to start";
        return `<div class="glass mod"><div class="tile" style="background:${P.tint(m.hue, 91)}">${m.emoji}</div>
          <div class="min-w-0"><div class="h text-[15px] leading-tight">${P.esc(m.label)}${mission ? " ⭐" : ""}</div>
          <div class="sub mt-1" style="${done ? "color:#17703a" : ""}">${status}</div>
          ${m.key === "grammar" ? `<div class="sub" style="color:var(--violet)">${P.grammarProgress}</div>` : ""}</div></div>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="wrap" style="padding-bottom:116px">
          <header class="pt-5">
            <div class="flex items-start justify-between gap-3">
              <div><div class="h text-[26px] leading-tight">🧭 English Quest</div>
                <div class="text-[14px] font-bold" style="color:var(--muted)">${P.dateText}</div></div>
            </div>
            <div class="flex flex-wrap gap-2 mt-3"><span class="pill">🔥 ${s.streak} day${s.streak === 1 ? "" : "s"}</span><span class="pill">🧊 ${s.freezes} freeze${s.freezes === 1 ? "" : "s"}</span></div>
          </header>

          <section class="glass mt-4 p-5" style="background:rgba(255,255,255,.72)">
            <div class="flex items-center justify-between gap-3">
              <div><div class="text-[13px] font-extrabold" style="color:var(--muted)">YOUR LEVEL</div>
                <div class="h text-[28px] leading-tight">${P.LEVELS[P.levelIndex]}</div></div>
              <div class="text-right text-[14px] font-bold" style="color:var(--muted)">Next level<div class="h text-[16px]" style="color:var(--violet)">${P.LEVELS[P.levelIndex + 1]} ›</div></div>
            </div>
            <div class="bar my-3"><i style="width:${P.progressPct}%"></i></div>
            <div class="text-[15px] font-extrabold mb-4">${s.total} / ${P.GOAL} missions completed</div>
            <div class="dots">${dots}</div>
          </section>

          <main>
            <div class="flex items-baseline justify-between mt-6 mb-3"><h2 class="h text-[20px]">Today's Missions</h2><span class="text-[14px] font-extrabold" style="color:var(--muted)">${P.doneCount}/3 done</span></div>
            <div class="flex flex-col gap-3">${missions}</div>
            <h2 class="h text-[20px] mt-7 mb-3">All Activities</h2>
            <div class="grid2">${mods}</div>
          </main>
        </div>
        <nav class="nav" aria-label="Preview navigation (not interactive)">
          <div class="on"><span>🏠</span>Home</div><div><span>🧩</span>Activities</div><div><span>🏅</span>Badges</div><div><span>📒</span>Notebook</div>
        </nav>`;
    })();
  </script>
</body>
</html>
